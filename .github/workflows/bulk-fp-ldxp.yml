name: bulk-fp-ldxp
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "最多处理多少个（0=全部）"
        default: "0"
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo '' | base64 -d > /tmp/bulk_fp_ldxp.py
            sudo docker cp /tmp/bulk_fp_ldxp.py mooo-si:/tmp/bulk_fp_ldxp.py
            sudo docker exec mooo-si python /tmp/bulk_fp_ldxp.py --limit=${{ inputs.limit }}
