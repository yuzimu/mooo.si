{% extends "base.html" %}
{% block main %}
<section class="mx-auto max-w-lg px-4 pt-20 sm:px-6">
  <div class="rounded-3xl border border-amber-500/30 bg-white/80 p-8 text-center dark:bg-ink-900/70">
    <span class="mx-auto grid h-14 w-14 place-items-center rounded-2xl bg-amber-500/10 text-amber-500"><i data-lucide="shield-alert" class="h-7 w-7"></i></span>
    <h1 class="mt-5 text-2xl font-extrabold text-slate-900 dark:text-white">即将离开 mooo.si</h1>
    <p class="mt-3 font-semibold text-amber-600 dark:text-amber-400">网络资源谨防欺诈，注意资金安全</p>
    {% if valid %}
    <p class="mt-5 text-sm text-slate-500">目标网站</p>
    <p class="mt-1 break-all font-mono text-xl font-bold text-rose-600 dark:text-rose-400">{{ host }}</p>
    <p class="mt-2 break-all text-xs text-slate-400">{{ url }}</p>
    <p class="mt-5 text-xs leading-5 text-slate-500">本站仅做信息聚合，不对第三方店铺/站点的商品、交易与售后负责。请勿私下转账，优先使用平台担保，谨慎提供账号密码。</p>
    <div class="mt-7 flex justify-center gap-3">
      <a href="javascript:history.back()" class="rounded-xl border border-slate-200 px-5 py-2.5 text-sm font-medium dark:border-white/10">返回</a>
      <a href="{{ url }}" rel="nofollow noopener noreferrer" class="rounded-xl bg-amber-500 px-5 py-2.5 text-sm font-semibold text-white hover:bg-amber-600">确认，前往</a>
    </div>
    {% else %}
    <p class="mt-5 text-sm text-rose-600">该链接无效或不在本站收录的目标范围内，已阻止跳转。</p>
    <a href="/" class="mt-6 inline-flex rounded-xl bg-slate-900 px-5 py-2.5 text-sm font-semibold text-white dark:bg-white dark:text-slate-900">返回首页</a>
    {% endif %}
  </div>
</section>
{% endblock %}
